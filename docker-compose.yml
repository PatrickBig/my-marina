services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mymarina
      POSTGRES_USER: mymarina
      POSTGRES_PASSWORD: mymarina
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymarina"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    environment:
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data/rustfs"
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

#  rustfs-init:
#    image: amazon/aws-cli:latest
#    environment:
#      AWS_ACCESS_KEY_ID: rustfsadmin
#      AWS_SECRET_ACCESS_KEY: rustfsadmin
#      AWS_DEFAULT_REGION: us-east-1
#    command: >
#      aws s3api create-bucket --bucket mymarina-local
#      --endpoint-url http://rustfs:9000
#    depends_on:
#      rustfs:
#        condition: service_healthy
#    deploy:
#      restart_policy:
#        condition: none

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/MyMarina.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mymarina;Username=mymarina;Password=mymarina;SSL Mode=Disable;GSS Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "dev-only-change-me-in-production-min-32ch"
      Jwt__Issuer: "mymarina-api"
      Jwt__Audience: "mymarina-clients"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:4321"
      Storage__Provider: "S3"
      Storage__S3__Endpoint: "http://rustfs:9000"
      Storage__S3__Bucket: "mymarina-local"
      Storage__S3__AccessKey: "rustfsadmin"
      Storage__S3__SecretKey: "rustfsadmin"
      Storage__S3__BucketPublicBaseUrl: "http://localhost:9000/mymarina-local"
      Storage__S3__MaxFileSizeBytes: "20971520"
    env_file:
      - path: ./app-secrets.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      api-setup:
        condition: service_completed_successfully

  web:
    build:
      context: src/MyMarina.Web
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    environment:
      API_BASE_URL: "http://localhost:5000"
    depends_on:
      - api

  marketing:
    build:
      context: src/MyMarina.Marketing
      dockerfile: Dockerfile
    environment:
      - API_BASE_URL=http://localhost:5000
      - APP_URL=http://localhost:5173
      - MARKETING_SITE_URL=http://localhost:4321
    ports:
      - "4321:8080"
    depends_on:
      - api
  
  api-setup:
    command:
      - "--setup"
    build:
      context: .
      dockerfile: src/MyMarina.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mymarina;Username=mymarina;Password=mymarina;SSL Mode=Disable;GSS Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "dev-only-change-me-in-production-min-32ch"
      Jwt__Issuer: "mymarina-api"
      Jwt__Audience: "mymarina-clients"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Setup__PlatformOperator__Email: "platform@mymarina.org"
      Setup__PlatformOperator__Password: "Testpassword1!"
      Setup__InitialMarina__TenantName: "Localhost Marina"
      Setup__InitialMarina__TenantSlug: "localhost-marina"
      Setup__InitialMarina__OwnerEmail: "marina@mymarina.org"
      Setup__InitialMarina__OwnerPassword: "Testpassword1!"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
