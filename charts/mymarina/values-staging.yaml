ingress:
  appHost: app-staging.mymarina.org
  apiHost: api-staging.mymarina.org
  marketingHost: staging.mymarina.org
  tlsSecretName: mymarina-staging-tls

api:
  env:
    corsAllowedOrigin: https://app-staging.mymarina.org
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

webui:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

redis:
  storage: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

database:
  storage: 2Gi
  backupStorage: 2Gi

setupJob:
  initialMarina:
    tenantName: "Bigler Point Marina (Staging)"
    tenantSlug: "bigler-point"

storage:
  s3:
    endpoint: "https://9dde5df340e1a330841b1bef228580b8.r2.cloudflarestorage.com"
    bucket: "my-marina-staging"
    bucketPublicBaseUrl: "https://storage-staging.mymarina.org"
    # Storage__S3__AccessKey and Storage__S3__SecretKey are managed by HashiCorp Vault
    # and injected into the pod via the app-secrets envFrom reference.
